name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and build · Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify project files
        run: python scripts/check_project.py
      - name: Install dependencies, run tests, build EXE
        shell: pwsh
        run: ./build.ps1
      - name: Check compact player layouts and keyboard focus
        shell: pwsh
        run: .venv/Scripts/python.exe scripts/check_ui.py
      - name: Package portable release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .venv/Scripts/python.exe scripts/package_release.py --exe build/dist/YandexMusicPresence.exe --version $version --out build/release
      - name: Upload EXE, ZIP and SHA-256 checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YandexMusicPresence-windows-x64
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
