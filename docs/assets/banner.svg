<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Ya Presence — your music on Discord</title>
<desc id="desc">Headphones with an online indicator, project title and an illustrated listening card</desc>
